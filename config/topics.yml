project:
  title: "Audio × Video AI Radar"
  subtitle: "每日追踪音视频 AI 的新论文、开源项目、产品动态与创意玩法"
  timezone: "Asia/Shanghai"
  lookback_hours: 72
  max_items_per_section: 30
  min_topic_score: 1
  product_min_topic_score: 2

topics:
  speech_generation:
    label: "语音生成"
    keywords:
      - text-to-speech
      - text to speech
      - speech synthesis
      - voice cloning
      - zero-shot tts
      - expressive speech
      - speech language model
  speech_editing:
    label: "语音编辑/转换"
    keywords:
      - speech editing
      - voice conversion
      - audio editing
      - speech restoration
      - speech enhancement
      - source separation
  audio_generation:
    label: "音频/音效生成"
    keywords:
      - audio generation
      - text-to-audio
      - text to audio
      - sound generation
      - video-to-audio
      - Foley
      - diffusion audio
  music:
    label: "音乐智能"
    keywords:
      - music generation
      - music understanding
      - singing voice
      - audio-to-midi
      - music language model
  speech_understanding:
    label: "语音理解"
    keywords:
      - speech recognition
      - automatic speech recognition
      - speech-to-text
      - speaker diarization
      - spoken language model
      - audio language model
      - speech translation
  codec_streaming:
    label: "Codec/实时音频"
    keywords:
      - neural audio codec
      - speech codec
      - audio codec
      - streaming speech
      - real-time speech
      - realtime speech
      - low latency audio
  safety_evaluation:
    label: "安全与评测"
    keywords:
      - audio deepfake
      - speech deepfake
      - spoofing detection
      - synthetic speech detection
      - audio watermark
      - speech watermark
      - audio evaluation
      - video deepfake
      - deepfake detection
      - media provenance
      - content credentials

  video_generation:
    label: "视频生成"
    keywords:
      - video generation
      - text-to-video
      - text to video
      - image-to-video
      - image to video
      - generative video
      - video diffusion
      - world model
      - camera control

  avatar_lipsync:
    label: "数字人/口型"
    keywords:
      - digital human
      - ai avatar
      - talking avatar
      - talking head
      - lip sync
      - lip-sync
      - audio-driven portrait
      - portrait animation
      - virtual human

  video_editing:
    label: "视频编辑/理解"
    keywords:
      - video editing
      - video editor
      - video understanding
      - video segmentation
      - video inpainting
      - video restoration
      - video translation
      - video dubbing
      - generative fill

  multimodal_creation:
    label: "跨模态创作"
    keywords:
      - multimodal creation
      - multimodal generation
      - audio visual generation
      - audio-visual generation
      - audio to video
      - audio-to-video
      - video to audio
      - video-to-audio
      - music video
      - beat sync
      - visual storytelling
      - interactive media

  creator_tools:
    label: "创作者工具"
    keywords:
      - creator tool
      - creative workflow
      - ai filmmaking
      - ai film
      - ai podcast
      - podcast editing
      - video podcast
      - automatic dubbing
      - media localization
      - content creation

paper_sources:
  arxiv_category_groups:
    - [cs.SD, eess.AS, cs.CL]
    - [cs.CV, cs.MM]
  max_results_per_group: 180

github_sources:
  min_stars: 15
  max_results_per_query: 12
  queries:
    - "topic:text-to-speech"
    - "topic:voice-conversion"
    - "topic:speech-recognition"
    - "topic:audio-generation"
    - "topic:music-generation"
    - "topic:source-separation"
    - "topic:audio-deepfake-detection"
    - "topic:video-generation"
    - "topic:text-to-video"
    - "topic:image-to-video"
    - "topic:lip-sync"
    - "topic:talking-head"
    - "topic:digital-human"
    - "topic:video-editing"
    - "topic:video-to-audio"
    - "topic:multimodal-generation"
    - "speech audio model in:name,description,readme"
    - "video avatar generative in:name,description,readme"

product_sources:
  feeds:
    - name: AssemblyAI
      url: https://www.assemblyai.com/blog/rss/
    - name: Deepgram
      url: https://deepgram.com/learn/rss.xml
    - name: ElevenLabs
      url: https://elevenlabs.io/blog/rss.xml
    - name: Descript
      url: https://www.descript.com/blog/rss.xml
    - name: Hugging Face
      url: https://huggingface.co/blog/feed.xml
    - name: NVIDIA Technical Blog
      url: https://developer.nvidia.com/blog/feed/
    - name: Product Hunt
      url: https://www.producthunt.com/feed
    - name: Google AI
      url: https://blog.google/technology/ai/rss/
    - name: Adobe Blog
      url: https://blog.adobe.com/en/feed.xml
    - name: Stability AI
      url: https://stability.ai/news/rss.xml
  news_queries:
    - '"AI audio" OR "speech AI" OR "voice AI" when:3d'
    - '"text-to-speech" OR "voice cloning" product when:3d'
    - '"music generation" AI product when:3d'
    - '"AI video" product launch OR release when:3d'
    - '"text-to-video" OR "image-to-video" product when:3d'
    - '"AI avatar" OR "lip sync" OR "video dubbing" product when:3d'
    - '"video-to-audio" OR "AI Foley" OR "audio-to-video" when:3d'
    - '"AI filmmaking" OR "creative AI tool" video when:3d'
    - 'site:runwayml.com OR site:heygen.com OR site:synthesia.io product update when:3d'
    - 'site:adobe.com "AI video" OR "AI audio" when:3d'
  hacker_news_queries:
    - "Show HN AI video"
    - "Show HN audio AI"
    - "Show HN music generation"
    - "Show HN voice"

enrichment:
  enabled: true
  api_base: https://api.openai.com/v1
  model: gpt-5.6-luna
  batch_size: 6
  max_items: 45
